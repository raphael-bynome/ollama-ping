[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ollama-ping"
dynamic = ["version"]
description = "Sonde de santé et de latence pour un serveur Ollama"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Raphaël" }]
keywords = ["ollama", "llm", "monitoring", "healthcheck", "prometheus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/raphael-bynome/ollama-ping"
Issues = "https://github.com/raphael-bynome/ollama-ping/issues"

[project.scripts]
ollama-ping = "ollama_ping.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.version]
path = "src/ollama_ping/__init__.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
